<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHIMONA CASINO — МИНЫ</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .casino-header {
            background: linear-gradient(145deg, #1a1a1a, #222);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { margin: 0 0 10px 0; color: #ffcc00; }
        .balance-box { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .balance-value { color: #ffcc00; }
        
        .controls {
            background-color: #1a1a1a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .input-group { display: flex; gap: 10px; width: 100%; max-width: 300px; }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: white;
            font-size: 16px;
        }
        
        .btn-main {
            background-color: #ffcc00;
            color: #121212;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            transition: 0.2s;
        }
        .btn-main:disabled { background-color: #555; color: #aaa; cursor: not-allowed; }
        
        .status-box {
            margin: 15px 0;
            font-size: 16px;
            min-height: 24px;
            color: #00ffcc;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 340px;
            margin: 0 auto 20px auto;
        }
        .cell {
            aspect-ratio: 1;
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s;
        }
        .cell:hover { background-color: #333; }
        .cell.opened-gem { background-color: #1b3a24; border-color: #2ecc71; }
        .cell.opened-mine { background-color: #4a1515; border-color: #e74c3c; }
        .cell.disabled { cursor: not-allowed; pointer-events: none; }
    </style>
</head>
<body>

    <div class="casino-header">
        <h2>🎰 SHIMONA CASINO 🎰</h2>
        <div class="balance-box">Баланс: <span id="balance" class="balance-value">5000</span> SB</div>
    </div>

    <!-- Блок настроек ставки -->
    <div class="controls" id="setup-panel">
        <div class="input-group">
            <input type="number" id="bet-input" placeholder="Ваша ставка" value="1000" min="1">
        </div>
        <div class="input-group">
            <select id="mines-input">
                <option value="3">3 мины</option>
                <option value="5">5 мин</option>
                <option value="8" selected>8 мин</option>
                <option value="10">10 мин</option>
                <option value="15">15 мин</option>
            </select>
        </div>
        <button class="btn-main" onclick="startNewGame()">Начать игру</button>
    </div>

    <!-- Информационная панель во время игры -->
    <div class="status-box" id="status-text">Укажите ставку и начните раунд</div>

    <!-- Игровое поле 5х5 -->
    <div class="grid" id="minefield">
        <!-- Клетки генерируются через JavaScript -->
    </div>

    <!-- Кнопка Кэшаута -->
    <button class="btn-main" id="cashout-btn" style="display: none; background-color: #2ecc71; color: white;" onclick="claimCashout()">
        Забрать деньги
    </button>

    <script>
        // !!! ВПИШИТЕ СЮДА ВАШ IP ИЗ TERMUX !!!
        const SERVER_URL = "http://10.25.118.157:8000";
        
        // Временный ID игрока (в будущем сюда можно привязать реальный ID из Telegram WebApp)
        const USER_ID = "user_123"; 

        let isGameActive = false;

        // Генерация пустого поля при загрузке страницы
        function createField() {
            const field = document.getElementById('minefield');
            field.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell disabled';
                cell.id = `cell-${i}`;
                cell.innerText = '·';
                cell.setAttribute('onclick', `clickCell(${i})`);
                field.appendChild(cell);
            }
        }

        // Запуск новой игры (Списание ставки)
        function startNewGame() {
            const bet = document.getElementById('bet-input').value;
            const minesCount = document.getElementById('mines-input').value;

            fetch(`${SERVER_URL}/api/mines/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: USER_ID,
                    bet: parseInt(bet),
                    mines_count: parseInt(minesCount)
                })
            })
            .then(res => {
                if (!res.ok) return res.json().then(err => { throw new Error(err.detail) });
                return res.json();
            })
            .then(data => {
                // Обновляем баланс, полученный от сервера Termux
                document.getElementById('balance').innerText = data.new_balance;
                document.getElementById('status-text').innerText = "🎰 Игра началась! Ищите кристаллы.";
                
                // Переключаем интерфейс в активное состояние
                isGameActive = true;
                document.getElementById('setup-panel').style.display = 'none';
                document.getElementById('cashout-btn').style.display = 'block';
                document.getElementById('cashout-btn').innerText = `Забрать ${bet} SB`;

                // Активируем клетки поля
                for (let i = 0; i < 25; i++) {
                    const cell = document.getElementById(`cell-${i}`);
                    cell.className = 'cell';
                    cell.innerText = '·';
                }
            })
            .catch(err => {
                alert(err.message);
            });
        }

        // Клик по ячейке
        function clickCell(index) {
            if (!isGameActive) return;
            const cell = document.getElementById(`cell-${index}`);
            if (cell.classList.contains('opened-gem')) return; // защита от повторного клика

            fetch(`${SERVER_URL}/api/mines/click`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: USER_ID,
                    cell_index: index
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'continue') {
                    // Угадал безопасную клетку
                    cell.className = 'cell opened-gem disabled';
                    cell.innerText = '💎';
                    document.getElementById('status-text').innerText = `Множитель: ${data.multiplier}x | Текущий куш: ${data.current_win} SB`;
                    document.getElementById('cashout-btn').innerText = `Забрать ${data.current_win} SB`;
                } 
                else if (data.status === 'game_over') {
                    // Напоролся на мину — ПРОИГРЫШ
                    cell.className = 'cell opened-mine disabled';
                    cell.innerText = '💥';
                    endGame(false, data.message);
                    
                    // Показываем, где были остальные мины
                    data.mines.forEach(mineIdx => {
                        const mCell = document.getElementById(`cell-${mineIdx}`);
                        if (mCell.innerText !== '💥') {
                            mCell.className = 'cell opened-mine disabled';
                            mCell.innerText = '💣';
                        }
                    });
                } 
                else if (data.status === 'win') {
                    // Идеальное прохождение (открыл все кристаллы)
                    cell.className = 'cell opened-gem disabled';
                    cell.innerText = '💎';
                    document.getElementById('balance').innerText = data.new_balance;
                    endGame(true, `🏆 Победа! Вы забрали всё поле и выиграли ${data.win_amount} SB!`);
                }
            });
        }

        // Кэшаут (Забрать текущие деньги)
        function claimCashout() {
            fetch(`${SERVER_URL}/api/mines/cashout`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: USER_ID })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('balance').innerText = data.new_balance;
                endGame(true, `💰 Вы успешно забрали ${data.win_amount} SB Coins!`);
            });
        }

        // Завершение раунда и возврат к ставкам
        function endGame(isWin, message) {
            isGameActive = false;
            document.getElementById('status-text').innerText = message;
